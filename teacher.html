<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب المعلم | متابعة الحصص</title>
<style>body{font-family:Tahoma,Arial;background:#f3f6f5;color:#183b32;margin:0}main{max-width:980px;margin:40px auto;padding:20px}section,article{background:white;padding:24px;border-radius:16px;margin:16px 0;border:1px solid #dde7e2}input,button,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccd9d2}input{display:block;margin:8px 0 16px;width:calc(100% - 26px)}button{background:#18634c;color:white;cursor:pointer}#login{max-width:400px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px}#error,#dataError{color:#a12626}small{color:#586a62}dl{display:grid;grid-template-columns:140px 1fr;gap:10px}dd{margin:0;white-space:pre-wrap}[hidden]{display:none!important}@media print{#logout,#filter{display:none}article{break-inside:avoid}}</style>
<main><header><h1>متابعة الحصص — حساب المعلم</h1><button id="logout" hidden>تسجيل الخروج</button></header>
<section id="login"><h2>دخول المعلم</h2><form id="form"><label for="identity">اسم المستخدم — رقم الهوية / الإقامة</label><input id="identity" inputmode="numeric" autocomplete="username" pattern="[0-9]{10}" maxlength="10" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">دخول</button><p id="error" role="alert"></p></form><a href="index.html">دخول الإدارة والمشرفين</a></section>
<section id="account" hidden><h2 id="name"></h2><p id="phone"></p><small>عرض جدولك وتقاريرك فقط</small><p id="summary"></p><label id="filter">اليوم <select id="day"><option value="all">الأسبوع كاملًا</option></select></label><button onclick="window.print()">طباعة التقرير</button><p id="dataError" role="alert"></p><div id="lessons"></div></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script>
window.FIREBASE_CONFIG = {
  apiKey: "AIzaSyBkzpz7hLmQlnL5nODu3dpKZD_if71nOcY",
  authDomain: "alsahafa-followup.firebaseapp.com",
  projectId: "alsahafa-followup",
  storageBucket: "alsahafa-followup.firebasestorage.app",
  messagingSenderId: "652830562435",
  appId: "1:652830562435:web:1c1b529b5d6b57c944a3b6"
};
const DAYS=[{n:'الأحد',h:'1448/4/30',g:'2026-10-11',gs:'11 أكتوبر'},{n:'الاثنين',h:'1448/5/1',g:'2026-10-12',gs:'12 أكتوبر'},{n:'الثلاثاء',h:'1448/5/2',g:'2026-10-13',gs:'13 أكتوبر'},{n:'الأربعاء',h:'1448/5/3',g:'2026-10-14',gs:'14 أكتوبر'},{n:'الخميس',h:'1448/5/4',g:'2026-10-15',gs:'15 أكتوبر'}];
const SLOTS=[['الأولى','6:30','7:10'],['الثانية','7:10','7:50'],['الثالثة','7:50','8:30'],['الرابعة','8:45','9:25'],['الخامسة','9:25','10:05'],['السادسة','10:05','10:45'],['السابعة','10:45','11:25']];
const CLS={c1:'الأول الثانوي',c2:'الثاني الثانوي',c3:'الثالث الثانوي',cs:'الثالث · الحاسب والهندسة',ba:'الثالث · إدارة الأعمال'};
const SUPCLS=['الأول الثانوي','الثاني الثانوي','الثالث الثانوي','مسار الحاسب والهندسة + إدارة الأعمال'];
const ST={done:{t:'تمت في وقتها',c:'s-done'},late:{t:'بدأت متأخرة',c:'s-late'},absent:{t:'لم تُعقد',c:'s-absent'},tech:{t:'مشكلة تقنية',c:'s-tech'}};
const G={
c1:["رياضيات|تامر شعيشع;انجليزي|عامر مجممي;أحياء|مجاهد الهجوة;كيمياء|موسى العطو;كفايات|فيصل بشير;تقنية|عبدالتواب خليفة;لفظي|محمود عبود","أحياء|مجاهد الهجوة;كيمياء|موسى العطو;تفكير ناقد|صابر محمد;انجليزي|مولى الطيب;رياضيات|تامر شعيشع;كفايات|فيصل بشير;قرآن|تركي الشقير","كيمياء|موسى العطو;أحياء|مجاهد الهجوة;كمي|تامر شعيشع;انجليزي|عامر مجممي;لفظي|محمود عبود;تفكير ناقد|صابر محمد;كفايات|فيصل بشير","انجليزي|مولى الطيب;كمي|تامر شعيشع;كيمياء|موسى العطو;تفكير ناقد|صابر محمد;أحياء|مجاهد الهجوة;كفايات|فيصل بشير","كيمياء|موسى العطو;رياضيات|محمد الشيمي;انجليزي|عامر مجممي;أحياء|مجاهد الهجوة;كفايات|فيصل بشير;تقنية|عبدالتواب خليفة"],
c2:["رياضيات|عبدالرحمن جذمي;أحياء|أحمد سمير;كيمياء|إيهاب الشافعي;فيزياء|أحمد حفني;انجليزي|الصادق إبراهيم;كفايات|أحمد عماد;تاريخ|صابر محمد","كمي|حسان طه;كيمياء|إيهاب الشافعي;فيزياء|أحمد حفني;لفظي|محمود عبود;كفايات|أحمد عماد;انجليزي|الصادق إبراهيم;أحياء|وليد الحداد","انجليزي|الصادق إبراهيم;كفايات|أحمد عماد;أحياء|وليد الحداد;كمي|حسان طه;فيزياء|أحمد حفني;كيمياء|إيهاب الشافعي","لفظي|محمود عبود;فيزياء|أحمد حفني;انجليزي|الصادق إبراهيم;رياضيات|عبدالرحمن جذمي;كيمياء|إيهاب الشافعي;تاريخ|صابر محمد","فيزياء|أحمد حفني;انجليزي|الصادق إبراهيم;كفايات|أحمد عماد;كيمياء|إيهاب الشافعي;رياضيات|عبدالرحمن جذمي;أحياء|وليد الحداد"],
c3:["لفظي|محمود عبود;تحصيلي فيزياء|عبدالحكيم قاسم;رياضيات|حسان طه;كيمياء|محمد الحصري;انجليزي|ماهر أباظة;علم أرض|أحمد حمدي;بحث|عادل المنيعي","تحصيلي أحياء|أحمد حمدي;انجليزي|ماهر أباظة;علم أرض|أحمد سمير;فيزياء|أحمد نجيب;تحصيلي كيمياء|محمد الحصري;بحث|عادل المنيعي;كمي|محمد زيد","انجليزي|ماهر أباظة;تحصيلي رياضيات|محمد زيد;كيمياء|محمد الحصري;تحصيلي أحياء|أحمد حمدي;فيزياء|أحمد نجيب;إدارية|سعد القرني","كيمياء|محمد الحصري;علم أرض|أحمد سمير;رياضيات|محمد الشيمي;انجليزي|ماهر أباظة;تحصيلي فيزياء|عبدالحكيم قاسم;تقنية|محمد الطاووس","فيزياء|عبدالحكيم قاسم;تحصيلي كيمياء|محمد الحصري;انجليزي|ماهر أباظة;رياضيات|محمد الشيمي;علم أرض|أحمد حمدي;تقنية|محمد الطاووس"],
ba:["مبادئ الإدارة|وليد الحداد;الإحصاء|عبدالتواب خليفة;الفقه|تركي الشقير","اللغة الإنجليزية|مولى الطيب;البحث ومصادر المعلومات|وليد الحداد;إدارة الفعاليات|أحمد حمدي","جغرافيا|فيصل بشير;مبادئ القانون|أحمد سمير;الفقه|تركي الشقير","دراسات أدبية|صابر محمد;تخطيط الحملات التسويقية|مجاهد الهجوة;مبادئ الإدارة|وليد الحداد","مبادئ القانون|أحمد سمير;اللغة الإنجليزية|مولى الطيب;الإحصاء|عبدالتواب خليفة"]};
const CS=[[1,0,'التصميم الهندسي','محمد الطاووس'],[2,5,'الذكاء الاصطناعي','محمد الطاووس'],[3,5,'الأمن السيبراني','عبدالتواب خليفة'],[4,5,'الدراسات الأدبية','أحمد عماد']];
const S=[];
[['c1',0],['c2',1],['c3',2]].forEach(([k,sup])=>G[k].forEach((d,di)=>d.split(';').forEach((x,pi)=>{const[a,b]=x.split('|');S.push({id:`${k}-d${di}-p${pi}`,sup,day:di,slot:pi,label:SLOTS[pi][0],cls:k,subj:a,teacher:b})})));
G.ba.forEach((d,di)=>d.split(';').forEach((x,pi)=>{const[a,b]=x.split('|');S.push({id:`ba-d${di}-p${pi}`,sup:3,day:di,slot:pi+1,label:SLOTS[pi][0]+' (المسار)',cls:'ba',subj:a,teacher:b})}));
CS.forEach(([di,pi,a,b])=>S.push({id:`cs-d${di}-p${pi}`,sup:3,day:di,slot:pi,label:SLOTS[pi][0],cls:'cs',subj:a,teacher:b}));
S.sort((x,y)=>x.day-y.day||x.slot-y.slot||x.sup-y.sup);
const byId=Object.fromEntries(S.map(s=>[s.id,s]));


firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status={done:'تمت في وقتها',late:'بدأت متأخرة',absent:'لم تُعقد',tech:'مشكلة تقنية'};
let mine=[],logs={},stops=[],generation=0;
function render(){const selected=$('day').value,list=mine.filter(s=>selected==='all'||s.day===Number(selected));$('summary').textContent=`${mine.length} حصة في الأسبوع · ${mine.filter(s=>logs[s.id]?.status).length} حصة مرصودة`;$('lessons').innerHTML=list.map(s=>{const l=logs[s.id]||{};return `<article><h3>${esc(s.subj)} — ${esc(CLS[s.cls])}</h3><p>${esc(DAYS[s.day].n)} ${esc(DAYS[s.day].h)} · ${esc(s.label)} · ${esc(SLOTS[s.slot][1])} إلى ${esc(SLOTS[s.slot][2])}</p><dl><dt>حالة الحصة</dt><dd>${esc(status[l.status]||'لم تُرصد')}</dd><dt>دخول المعلم</dt><dd>${esc(l.entry||'—')}</dd><dt>الحضور / الغياب</dt><dd>${esc(l.present??'—')} / ${esc(l.absent??'—')}</dd><dt>التقييم</dt><dd>${esc(l.rating||'—')}</dd><dt>الملاحظات</dt><dd>${esc(l.notes||'—')}</dd></dl></article>`}).join('')||'<p>لا توجد حصص مسجلة لك في هذه الفترة.</p>'}
DAYS.forEach((d,i)=>{$('day').add(new Option(d.n,i))});$('day').onchange=render;
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;try{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword($('identity').value.trim()+'@teachers.alsahafa-followup.invalid',$('password').value);$('password').value=''}catch(e){$('error').textContent=e.code==='auth/network-request-failed'?'تعذّر الاتصال. حاول مجددًا.':'تعذّر الدخول. تحقق من رقم الهوية وكلمة المرور.'}finally{$('submit').disabled=false}};
$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{const current=++generation;stops.forEach(f=>f());stops=[];mine=[];logs={};$('account').hidden=true;$('logout').hidden=true;$('login').hidden=false;if(!user)return;try{const doc=await db.doc('teacherProfiles/'+user.uid).get();if(current!==generation)return;if(!doc.exists||doc.data().active!==true)throw Error('profile');const p=doc.data();mine=S.filter(s=>s.teacher===p.scheduleName);$('name').textContent=p.name;$('phone').textContent=p.phone?'رقم الجوال: '+p.phone:'رقم الجوال يحتاج مراجعة';$('login').hidden=true;$('account').hidden=false;$('logout').hidden=false;$('dataError').textContent='';render();mine.forEach(s=>{stops.push(db.doc('logs/'+s.id).onSnapshot(d=>{logs[s.id]=d.exists?d.data():{};render()},()=>{$('dataError').textContent='تعذّر تحميل بعض التقارير. راجع مسؤول المنصة.'}))})}catch(e){if(current!==generation)return;await auth.signOut();$('error').textContent='حساب المعلم غير مفعّل أو تعذّر تحميل بياناته. راجع مسؤول المنصة.'}});
</script></html>
