<style>body{font-family:Tahoma,Arial;background:#f3f6f5;color:#183b32;margin:0}main{max-width:980px;margin:40px auto;padding:20px}section,article{background:white;padding:24px;border-radius:16px;margin:16px 0;border:1px solid #dde7e2}input,button,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #ccd9d2}input{display:block;margin:8px 0 16px;width:calc(100% - 26px)}button{background:#18634c;color:white;cursor:pointer}#login{max-width:400px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px}#error,#dataError{color:#a12626}small{color:#586a62}dl{display:grid;grid-template-columns:140px 1fr;gap:10px}dd{margin:0;white-space:pre-wrap}[hidden]{display:none!important}@media print{#logout,#filter,#wfilter{display:none}article{break-inside:avoid}}</style>
<main><header><h1>متابعة الحصص — حساب المعلم</h1><button id="logout" hidden>تسجيل الخروج</button></header>

const WEEK0='2026-10-11';
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const HFMT=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{timeZone:'UTC',year:'numeric',month:'numeric',day:'numeric'});
function hijri(iso){const o={};HFMT.formatToParts(new Date(iso+'T12:00:00Z')).forEach(x=>o[x.type]=x.value);return `${o.year}/${o.month}/${o.day}`}
const DNAMES=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const weekDays=wk=>DNAMES.map((n,i)=>{const g=addDays(wk,i);return{n,h:hijri(g),g}});
const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Riyadh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const CUR_WEEK=(()=>{const w=addDays(today,-new Date(today+'T12:00:00Z').getUTCDay());return w<WEEK0?WEEK0:w})();
const allWeeks=()=>{const o=[];for(let w=WEEK0;w<=CUR_WEEK;w=addDays(w,7))o.push(w);return o};
const logsCol=wk=>wk===WEEK0?'logs':`weeks/${wk}/logs`;
let WEEK=CUR_WEEK,DAYS=weekDays(WEEK);

const SUPCLS=['الأول الثانوي','الثاني الثانوي','الثالث الثانوي','مسار الحاسب والهندسة + إدارة الأعمال'];
const ST={done:{t:'تمت في وقتها',c:'s-done'},late:{t:'بدأت متأخرة',c:'s-late'},absent:{t:'لم تُعقد',c:'s-absent'},tech:{t:'مشكلة تقنية',c:'s-tech'}};
const G={
c1:["رياضيات|تامر شعيشع;انجليزي|عامر مجممي;أحياء|مجاهد الهجوة;كيمياء|موسى العطو;كفايات|فيصل بشير;تقنية|عبدالتواب خليفة;لفظي|محمود عبود","أحياء|مجاهد الهجوة;كيمياء|موسى العطو;تفكير ناقد|صابر محمد;انجليزي|مولى الطيب;رياضيات|تامر شعيشع;كفايات|فيصل بشير;قرآن|تركي الشقير","كيمياء|موسى العطو;أحياء|مجاهد الهجوة;كمي|تامر شعيشع;انجليزي|عامر مجممي;لفظي|محمود عبود;تفكير ناقد|صابر محمد;كفايات|فيصل بشير","انجليزي|مولى الطيب;كمي|تامر شعيشع;كيمياء|موسى العطو;تفكير ناقد|صابر محمد;أحياء|مجاهد الهجوة;كفايات|فيصل بشير","كيمياء|موسى العطو;رياضيات|محمد الشيمي;انجليزي|عامر مجممي;أحياء|مجاهد الهجوة;كفايات|فيصل بشير;تقنية|عبدالتواب خليفة"],
c2:["رياضيات|عبدالرحمن جذمي;أحياء|أحمد سمير;كيمياء|إيهاب الشافعي;فيزياء|أحمد حفني;انجليزي|الصادق إبراهيم;كفايات|أحمد عماد;تاريخ|صابر محمد","كمي|حسان طه;كيمياء|إيهاب الشافعي;فيزياء|أحمد حفني;لفظي|محمود عبود;كفايات|أحمد عماد;انجليزي|الصادق إبراهيم;أحياء|وليد الحداد","انجليزي|الصادق إبراهيم;كفايات|أحمد عماد;أحياء|وليد الحداد;كمي|حسان طه;فيزياء|أحمد حفني;كيمياء|إيهاب الشافعي","لفظي|محمود عبود;فيزياء|أحمد حفني;انجليزي|الصادق إبراهيم;رياضيات|عبدالرحمن جذمي;كيمياء|إيهاب الشافعي;تاريخ|صابر محمد","فيزياء|أحمد حفني;انجليزي|الصادق إبراهيم;كفايات|أحمد عماد;كيمياء|إيهاب الشافعي;رياضيات|عبدالرحمن جذمي;أحياء|وليد الحداد"],
c3:["لفظي|محمود عبود;تحصيلي فيزياء|عبدالحكيم قاسم;رياضيات|حسان طه;كيمياء|محمد الحصري;انجليزي|ماهر أباظة;علم أرض|أحمد حمدي;بحث|عادل المنيعي","تحصيلي أحياء|أحمد حمدي;انجليزي|ماهر أباظة;علم أرض|أحمد سمير;فيزياء|أحمد نجيب;تحصيلي كيمياء|محمد الحصري;بحث|عادل المنيعي;كمي|محمد زيد","انجليزي|ماهر أباظة;تحصيلي رياضيات|محمد زيد;كيمياء|محمد الحصري;تحصيلي أحياء|أحمد حمدي;فيزياء|أحمد نجيب;إدارية|سعد القرني","كيمياء|محمد الحصري;علم أرض|أحمد سمير;رياضيات|محمد الشيمي;انجليزي|ماهر أباظة;تحصيلي فيزياء|عبدالحكيم قاسم;تقنية|محمد الطاووس","فيزياء|عبدالحكيم قاسم;تحصيلي كيمياء|محمد الحصري;انجليزي|ماهر أباظة;رياضيات|محمد الشيمي;علم أرض|أحمد حمدي;تقنية|محمد الطاووس"],
ba:["مبادئ الإدارة|وليد الحداد;الإحصاء|عبدالتواب خليفة;الفقه|تركي الشقير","اللغة الإنجليزية|مولى الطيب;البحث ومصادر المعلومات|وليد الحداد;إدارة الفعاليات|أحمد حمدي","جغرافيا|فيصل بشير;مبادئ القانون|أحمد سمير;الفقه|تركي الشقير","دراسات أدبية|صابر محمد;تخطيط الحملات التسويقية|مجاهد الهجوة;مبادئ الإدارة|وليد الحداد","مبادئ القانون|أحمد سمير;اللغة الإنجليزية|مولى الطيب;الإحصاء|عبدالتواب خليفة"]};
const CS=[[1,0,'التصميم الهندسي','محمد الطاووس'],[2,5,'الذكاء الاصطناعي','محمد الطاووس'],[3,5,'الأمن السيبراني','عبدالتواب خليفة'],[4,5,'الدراسات الأدبية','أحمد عماد']];
const S=[];
[['c1',0],['c2',1],['c3',2]].forEach(([k,sup])=>G[k].forEach((d,di)=>d.split(';').forEach((x,pi)=>{const[a,b]=x.split('|');S.push({id:`${k}-d${di}-p${pi}`,sup,day:di,slot:pi,label:SLOTS[pi][0],cls:k,subj:a,teacher:b})})));
G.ba.forEach((d,di)=>d.split(';').forEach((x,pi)=>{const[a,b]=x.split('|');S.push({id:`ba-d${di}-p${pi}`,sup:3,day:di,slot:pi+1,label:SLOTS[pi][0]+' (المسار)',cls:'ba',subj:a,teacher:b})}));
CS.forEach(([di,pi,a,b])=>S.push({id:`cs-d${di}-p${pi}`,sup:3,day:di,slot:pi,label:SLOTS[pi][0],cls:'cs',subj:a,teacher:b}));
S.sort((x,y)=>x.day-y.day||x.slot-y.slot||x.sup-y.sup);
const byId=Object.fromEntries(S.map(s=>[s.id,s]));


firebase.initializeApp(window.FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status={done:'تمت في وقتها',late:'بدأت متأخرة',absent:'لم تُعقد',tech:'مشكلة تقنية'};
let mine=[],logs={},stops=[],generation=0;
function render(){const selected=$('day').value,list=mine.filter(s=>selected==='all'||s.day===Number(selected));$('summary').textContent=`${mine.length} حصة في الأسبوع · ${mine.filter(s=>logs[s.id]?.status).length} حصة مرصودة`;$('lessons').innerHTML=list.map(s=>{const l=logs[s.id]||{};return `<article><h3>${esc(s.subj)} — ${esc(CLS[s.cls])}</h3><p>${esc(DAYS[s.day].n)} ${esc(DAYS[s.day].h)} · ${esc(s.label)} · ${esc(SLOTS[s.slot][1])} إلى ${esc(SLOTS[s.slot][2])}</p><dl><dt>حالة الحصة</dt><dd>${esc(status[l.status]||'لم تُرصد')}</dd><dt>دخول المعلم</dt><dd>${esc(l.entry||'—')}</dd><dt>الحضور / الغياب</dt><dd>${esc(l.present??'—')} / ${esc(l.absent??'—')}</dd><dt>التقييم</dt><dd>${esc((()=>{const v=[l.rating,l.ratingMon].map(Number).filter(x=>x>0);return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1).replace(/\.0$/,'')+' من 5':'—'})())}</dd><dt>الملاحظات</dt><dd>${esc(l.notes||'—')}</dd></dl></article>`}).join('')||'<p>لا توجد حصص مسجلة لك في هذه الفترة.</p>'}
function paintDays(){const v=$('day').value;$('day').innerHTML='<option value="all">الأسبوع كاملًا</option>';DAYS.forEach((d,i)=>{$('day').add(new Option(d.n+' '+d.h,i))});$('day').value=v||'all'}
allWeeks().reverse().forEach(w=>{const d=weekDays(w);$('week').add(new Option((w===CUR_WEEK?'هذا الأسبوع · ':'')+d[0].h+' – '+d[4].h+'هـ',w))});
paintDays();$('day').onchange=render;
function subscribe(){stops.forEach(f=>f());stops=[];logs={};render();const wk=WEEK;mine.forEach(s=>{stops.push(db.doc(logsCol(wk)+'/'+s.id).onSnapshot(d=>{if(wk!==WEEK)return;logs[s.id]=d.exists?d.data():{};render()},()=>{$('dataError').textContent='تعذّر تحميل بعض التقارير. راجع مسؤول المنصة.'}))})}
$('week').onchange=()=>{WEEK=$('week').value;DAYS=weekDays(WEEK);paintDays();subscribe()};
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';$('submit').disabled=true;try{await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword($('identity').value.trim()+'@teachers.alsahafa-followup.invalid',$('password').value);$('password').value=''}catch(e){$('error').textContent=e.code==='auth/network-request-failed'?'تعذّر الاتصال. حاول مجددًا.':'تعذّر الدخول. تحقق من رقم الهوية وكلمة المرور.'}finally{$('submit').disabled=false}};
$('logout').onclick=()=>auth.signOut();
auth.onAuthStateChanged(async user=>{const current=++generation;stops.forEach(f=>f());stops=[];mine=[];logs={};$('account').hidden=true;$('logout').hidden=true;$('login').hidden=false;if(!user)return;try{const doc=await db.doc('teacherProfiles/'+user.uid).get();if(current!==generation)return;if(!doc.exists||doc.data().active!==true)throw Error('profile');const p=doc.data();mine=S.filter(s=>s.teacher===p.scheduleName);$('name').textContent=p.name;$('phone').textContent=p.phone?'رقم الجوال: '+p.phone:'رقم الجوال يحتاج مراجعة';$('login').hidden=true;$('account').hidden=false;$('logout').hidden=false;$('dataError').textContent='';subscribe()}catch(e){if(current!==generation)return;await auth.signOut();$('error').textContent='حساب المعلم غير مفعّل أو تعذّر تحميل بياناته. راجع مسؤول المنصة.'}});
</script></html>
