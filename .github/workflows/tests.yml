# Runs on every pull request and on main: syntax check for all browser scripts,
# the unit tests, and the Firestore rules tests on the local emulator.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Syntax check browser scripts
        run: for f in *.js; do node --check "$f" || exit 1; done
      - name: Unit tests
        run: node --test $(ls tests/*.test.cjs | grep -v rules)
  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        run: npm ci --prefix tests --no-audit --no-fund
      - name: Rules tests on the Firestore emulator
        run: npm --prefix tests run test:rules
